services:
  subscriber:
    build: .
    command: ["python", "run_subscriber.py", "/config/feeds.yaml"]
    volumes:
      - ./config:/config:ro
      - subscriptions:/subscriptions
    environment:
      - PODDERTON_PATH=/

  generator:
    build: .
    command: ["python", "run_generator.py", "/config/feeds.yaml"]
    ports:
      - "9988:9988"
    volumes:
      - ./config:/config:ro
      - subscriptions:/subscriptions:ro
      - feeds:/feeds
    environment:
      - PODDERTON_PATH=/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9988/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  subscriptions:
  feeds:
